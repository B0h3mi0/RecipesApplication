<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecetasApp - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{common/header :: header}"></div>
<div class="container py-5">

    <h1 class="mb-5 text-center">Bienvenido a RecetasApp</h1>

    <section class="mb-5">
        <h3 class="mb-4">Recetas Populares</h3>
        <div id="popularesCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="d-flex justify-content-around">
                        <div th:replace="common/card :: recetaCard(${recetasPopulares[0]})"></div>
                        <div th:replace="common/card :: recetaCard(${recetasPopulares[1]})"></div>
                        <div th:replace="common/card :: recetaCard(${recetasPopulares[2]})"></div>
                        <div th:replace="common/card :: recetaCard(${recetasPopulares[3]})"></div>
                        <div th:replace="common/card :: recetaCard(${recetasPopulares[4]})"></div>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#popularesCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#popularesCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>

    <section>
        <h3 class="mb-4">Recetas Recientes</h3>
        <div id="recientesCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="d-flex justify-content-around">
                        <div th:replace="common/card :: recetaCard(${recetasRecientes[0]})"></div>
                        <div th:replace="common/card :: recetaCard(${recetasRecientes[1]})"></div>
                        <div th:replace="common/card :: recetaCard(${recetasRecientes[2]})"></div>
                        <div th:replace="common/card :: recetaCard(${recetasRecientes[3]})"></div>
                        <div th:replace="common/card :: recetaCard(${recetasRecientes[4]})"></div>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#recientesCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#recientesCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
