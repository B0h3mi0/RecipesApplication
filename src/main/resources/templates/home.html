<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenido del servicio web</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }
        main {
            flex: 1;
        }

        /* Carrusel */
        .carousel-container {
            position: relative;
            max-width: 900px;
            margin: auto;
            overflow: hidden;
            border-radius: 15px;
        }
        .carousel img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
        }

        /* Botones carrusel */
        .carousel-control {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.55);
            border: none;
            color: white;
            font-size: 30px;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
        }
        .prev { left: 10px; }
        .next { right: 10px; }
        .carousel-control:hover {
            background: rgba(0,0,0,0.8);
        }

        /* Cards */
        .novedades {
            margin: 60px auto;
            max-width: 1100px;
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            background: white;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
            transition: 0.3s;
        }
        .card-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 22px rgba(0,0,0,0.18);
        }
    </style>
</head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="container text-center py-5">

    <h2 class="fw-bold mb-4" th:text="|Bienvenido a ${name}!|"></h2>

    <div sec:authorize="isAuthenticated()">
        <h4 class="text-success" th:inline="text">
            Hola <span th:remove="tag" sec:authentication="name"></span> 👋
        </h4>
    </div>

    <section class="carousel-container mt-4">
        <div id="customCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img th:src="@{/images/produ2.jpg}" class="d-block w-100" alt="">
                </div>
                <div class="carousel-item">
                    <img th:src="@{/images/produ1.jpeg}" class="d-block w-100" alt="">
                </div>
                <div class="carousel-item">
                    <img th:src="@{/images/produ3.jpg}" class="d-block w-100" alt="">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#customCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#customCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>

    <section class="novedades">
        <h2 class="text-center fw-bold mb-4">📰 Novedades</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card card-custom p-3">
                    <h5 class="fw-bold">El fin de JORGITO PARRILLERO</h5>
                    <p class="text-muted">Se confirma que dejará de subir contenido parrillero y se vuelve vegano.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-custom p-3">
                    <h5 class="fw-bold">Los alimentos fermentados</h5>
                    <p class="text-muted">Beneficios para salud intestinal y sistema inmunitario.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-custom p-3">
                    <h5 class="fw-bold">Efecto Otakin: el "antiinfluencer"</h5>
                    <p class="text-muted">Tras una reseña viral, restaurantes tiemblan 😱.</p>
                </div>
            </div>
        </div>
    </section>

</main>

<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
