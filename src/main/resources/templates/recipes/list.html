<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de Recetas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div th:replace="~{common/header :: header}"></div>

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Recetario</h2>
    <a th:href="@{/recipes/create}" class="btn btn-primary">Nueva Receta</a>
  </div>

  <table class="table table-striped shadow-sm">
    <thead class="table-dark">
    <tr>
      <th>Nombre</th>
      <th>Tiempo de Preparación</th>
      <th>Descripción</th>
      <th style="width:180px">Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="r : ${recipes}">
      <td th:text="${r.name}"></td>
      <td th:text="${r.preparationTime}"></td>
      <td th:text="${r.description}"></td>
      <td class="d-flex gap-2">

          <!-- Botón Multimedia -->
          <button type="button" class="btn btn-sm btn-outline-dark"
                  data-bs-toggle="modal"
                  data-bs-target="#mediaModal">
              Multimedia
          </button>

        <a th:href="@{'/recipes/' + ${r.id}}" class="btn btn-sm btn-outline-secondary">
          Ver
        </a>

        <a th:href="@{'/recipes/edit/' + ${r.id}}" class="btn btn-sm btn-outline-primary">
          Editar
        </a>

        <form th:action="@{'/recipes/delete/' + ${r.id}}" method="post"
              onsubmit="return confirm('¿Seguro que quieres eliminar esta receta?');">
          <button type="submit" class="btn btn-sm btn-outline-danger">
            Eliminar
          </button>
        </form>

      </td>
    </tr>
    </tbody>
  </table>

</div>

<div th:replace="~{common/footer :: footer}"></div>

<!-- Modal Multimedia -->
<div class="modal fade" id="mediaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Subir multimedia</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div class="border border-2 border-secondary rounded p-4 text-center"
                     style="min-height: 180px; cursor: pointer; background: #f9f9f9;">
                    <h5 class="mb-3">Arrastra aquí tu archivo</h5>
                    <p class="text-muted">o</p>

                    <button class="btn btn-dark mt-2">
                        Buscar en tu equipo
                    </button>
                </div>

            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cerrar
                </button>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
